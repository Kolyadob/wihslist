{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid rounded mb-4" alt="{{ product.name }}">
    {% else %}
      <img src="{% static 'img/placeholder.jpg' %}" class="img-fluid rounded mb-4" alt="Placeholder">
    {% endif %}
  </div>
  <div class="col-md-6">
    <h1>{{ product.name }}</h1>
    <p class="lead">${{ product.price }}</p>
    
    <div class="mb-4">
      <h5>Описание</h5>
      <p>{{ product.description|linebreaksbr }}</p>
    </div>
    
    <form action="{% url 'add_to_cart' product.id %}" method="post">
      {% csrf_token %}
      <div class="d-flex align-items-center mb-3">
        <label class="me-3">Количество:</label>
        <input type="number" name="quantity" value="1" min="1" class="form-control w-25 me-3">
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="fas fa-cart-plus me-1"></i> Добавить в вишлист
        </button>
      </div>
    </form>
    
    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-left me-1"></i> Вернуться к списку
    </a>
  </div>
</div>
{% endblock %}
