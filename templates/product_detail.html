{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>{{ product.name }}</h1>
{% if product.image %}
  <img src="{{ product.image.url }}" class="img-fluid mb-3" style="max-height: 300px; object-fit: cover;">
{% else %}
  <img src="{% static 'img/placeholder.jpg' %}" class="img-fluid mb-3" style="max-height: 300px; object-fit: cover;">
{% endif %}
<p>{{ product.description }}</p>
<p><strong>Price: </strong>${{ product.price }}</p>
<form action="{% url 'add_to_cart' product.id %}" method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-success">Add to Cart</button>
</form>
{% endblock %}
