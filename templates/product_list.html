{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Available Products</h1>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
  {% for product in products %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
        {% else %}
            <img src="https://placehold.co/300x200?text={{ product.name|urlencode }}" class="card-img-top" style="height: 200px; object-fit: cover;">
        {% endif %}
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">${{ product.price }}</p>
          <a href="{% url 'product_detail' product.pk %}" class="btn btn-primary mt-auto">View</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
